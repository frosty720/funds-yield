[profile.default]
src = 'contracts'
out = 'out'
libs = ['lib']
test = 'test'
script = 'script'
# Beefy's exact settings (Sourcify metadata of 0xFc90…B433, 0x6f99…c723, 0x9476…48F1). Don't change them.
solc_version = '0.8.23'
evm_version = 'paris'
optimizer = true
optimizer_runs = 200
fs_permissions = [
	{ access = 'read', path = './out' },
	{ access = 'read', path = './script/config' },
	{ access = 'read-write', path = './deployments' },
]

[fuzz]
runs = 256
